spring.application.name=marjea-java-service
spring.profiles.default=dev
server.address=127.0.0.1
server.port=${MARJEA_JAVA_PORT:8099}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
marjea.security.jwt.issuer-uri=${MARJEA_CLERK_ISSUER_URI}
marjea.security.jwt.jwks-uri=${MARJEA_CLERK_JWKS_URI}
marjea.security.jwt.audience=${MARJEA_API_AUDIENCE}
marjea.monitoring.enabled=${MARJEA_MONITORING_ENABLED:false}
marjea.monitoring.initial-delay-ms=30000
marjea.monitoring.fixed-delay-ms=900000
spring.main.banner-mode=off
